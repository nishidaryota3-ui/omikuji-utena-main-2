<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>うてな俳句会 臺俳句</title>

    <!-- ★ PWA Manifest ファイルの読み込み -->
    <link rel="manifest" href="manifest.json">

    <!-- PWA / Android・iOS スタンドアロン指定 -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="うてな俳句">
    <meta name="application-name" content="うてな俳句">
    <meta name="theme-color" content="#faf9f6">
    
    <!-- アプリアイコン指定 -->
    <link rel="icon" type="image/png" sizes="192x192" href="icon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="icon.png">

    <!-- 🎨 デザインファイルを読み込み -->
    <link rel="stylesheet" href="style.css?v=3">
</head>
<body>

    <div id="loadingOverlay">うてな俳句を開いています...</div>

    <!-- 🐾 おみ句じ猫ボタン -->
    <img id="fixedCatBtn" src="omikuji-cat.png" alt="おみ句じを引く" class="fixed-cat-trigger hidden" onclick="launchOmikuji()" title="おみ句じを引く">

    <!-- 2段構造のグローバルヘッダー領域 -->
    <div id="headerArea" class="global-header-area">
        <div class="header-row-top">
            <div id="globalBreadcrumb" class="breadcrumb" style="display: none;"></div>
        </div>
        <div class="header-row-bottom">
            <div id="roomMainTag" class="info-upper-tag"></div>
            <div id="infoTrigger" onclick="revealHiddenInfo()">ℹ</div>
        </div>
    </div>

    <!-- 🌸 季語解説ポップアップカード -->
    <div id="kigoCardOverlay" class="card-overlay hidden" onclick="closeKigoCard(event)">
        <div class="kigo-card-wrapper" onclick="event.stopPropagation()">
            <span class="card-close-btn" onclick="closeKigoCard(event)">✕</span>
            <div class="kigo-card-content" id="kigoCardContentArea" onclick="onKigoCardClicked()">
                <div class="card-column parent-kigo-col" id="cardParentKigo"></div>
                <div class="card-column child-kigo-col" id="cardChildKigo"></div>
                <div class="card-column desc-kigo-col" id="cardDesc"></div>
            </div>
            <!-- 下部アクションバー（例句がある場合はボタンを表示） -->
            <div id="cardActionFooter" class="card-action-footer">
                <button id="cardViewWorksBtn" class="card-action-btn" onclick="onKigoCardClicked()">
                    例句を見る（<span id="cardWorkCountNum">0</span>句） →
                </button>
            </div>
        </div>
    </div>

    <!-- 🏡 トップメニュー（うてな俳句 / 季寄せ / 句集 / おみ句じ） -->
    <div id="topPage" class="layer-page">
        <!-- 💮 トップページ 左隅の落款スタンプ -->
        <img src="stamp_utena.png?v=2" alt="うてな" class="top-page-stamp">

        <!-- おみ句じ（直接いっしょくた起動） -->
        <div class="menu-block">
            <div class="vertical-link main-headline" onclick="launchOmikuji()">おみ句じ</div>
        </div>

        <!-- 句集（俳人別アーカイブ） -->
        <div class="menu-block">
            <div class="vertical-link main-headline" onclick="showKushuAuthorList()">句集</div>
        </div>
        
        <!-- 季寄せ（風月スタイル大画面） -->
        <div class="menu-block">
            <div class="vertical-link main-headline" onclick="renderPage('saijikiPage')">季寄せ</div>
        </div>

        <!-- うてな俳句（号別アーカイブ） -->
        <div class="menu-block">
            <div class="vertical-link main-headline" onclick="showIssueYearList()">うてな俳句</div>
        </div>
    </div>

    <!-- 👥 句集：俳人一覧 ページ -->
    <div id="kushuAuthorPage" class="layer-page">
        <div id="kushuAuthorList" class="horizontal-scroll-container kushu-author-scroll-list"></div>
    </div>

    <!-- 🎴 句集：作者選択ハブ ページ（時系列 ｜ おみ句じ） -->
    <div id="kushuAuthorHubPage" class="layer-page">
        <div class="fits-screen-container">
            <div class="vertical-link" onclick="openKushuAuthorChrono()">時系列</div>
            <div class="vertical-link" onclick="openKushuAuthorOmikuji()">おみ句じ</div>
        </div>
    </div>

    <!-- 📜 句集：時系列スクロール ページ -->
    <div id="kushuChronoPage" class="layer-page kushu-detail-layer">
        <!-- 上部コントロールバー（年月表示ON/OFF ＆ 印刷ボタン） -->
        <div class="kushu-control-bar">
            <div class="kushu-author-title" id="kushuChronoAuthorTitle"></div>
            <div class="kushu-control-actions">
                <label class="kushu-toggle-label">
                    <span class="toggle-text">年月表示</span>
                    <input type="checkbox" id="kushuIssueDividerToggle" checked onchange="toggleKushuIssueDividers()">
                    <span class="toggle-slider"></span>
                </label>
                <button type="button" class="kushu-print-btn" onclick="openPrintModal()">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: -1px; margin-right: 3px;"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>
                    印刷
                </button>
            </div>
        </div>

        <!-- 時系列スクロールリスト -->
        <div id="kushuHaikuList" class="horizontal-scroll-container kushu-haiku-scroll-list"></div>
    </div>

    <!-- 🖨️ 句集 印刷設定モーダル -->
    <div id="printSettingModal" class="card-overlay hidden" onclick="closePrintModal(event)">
        <div class="print-modal-box" onclick="event.stopPropagation()">
            <span class="card-close-btn" onclick="closePrintModal(event)">✕</span>
            <div class="print-modal-title">句集の小冊子印刷 (PDF)</div>
            
            <!-- 印刷形式 -->
            <div class="print-setting-row">
                <span class="print-setting-label">印刷形式</span>
                <div class="print-mode-switch-group">
                    <button type="button" id="printModeSingleBtn" class="print-mode-btn active" onclick="setPrintMode('single')">片面手折り</button>
                    <button type="button" id="printModeBookletBtn" class="print-mode-btn" onclick="setPrintMode('booklet')">両面小冊子</button>
                </div>
            </div>

            <!-- 1ページの句数 -->
            <div class="print-setting-row">
                <span class="print-setting-label">1ページの句数</span>
                <select id="printLinesPerPage" class="print-select-box" onchange="onPrintOptionChanged()">
                    <option value="1">1句（ゆったり）</option>
                    <option value="2">2句</option>
                    <option value="3">3句（標準）</option>
                    <option value="4">4句</option>
                    <option value="5" selected>5句（うてな五句組）</option>
                </select>
            </div>

            <!-- 発行年月の挿入 -->
            <div class="print-setting-row">
                <span class="print-setting-label">発行年月の挿入</span>
                <div class="print-mode-switch-group">
                    <button type="button" id="printYearMonthOnBtn" class="print-mode-btn active" onclick="setPrintYearMonth(true)">挿入する</button>
                    <button type="button" id="printYearMonthOffBtn" class="print-mode-btn" onclick="setPrintYearMonth(false)">挿入しない</button>
                </div>
            </div>

            <!-- 印刷実行ボタン -->
            <div class="print-modal-actions">
                <button type="button" class="print-exec-btn" onclick="executeKushuPrint()">印刷プレビュー (PDF) を開く</button>
            </div>
            
            <div id="printSubNote" class="print-sub-note">※片面印刷：A4横に2ページ並べて印刷し、半分に折って重ねるだけの簡単製本</div>
        </div>
    </div>

    <!-- 🌸 季寄せ：大画面 ページ（風月スタイル） -->
    <div id="saijikiPage" class="layer-page saijiki-screen-layer">
        <div class="saijiki-screen-header">
            <!-- 常時開いた洗練された検索バー -->
            <div class="saijiki-search-container">
                <div class="saijiki-search-box-pill">
                    <span class="search-icon">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    </span>
                    <input type="text" id="saijikiSearchInput" placeholder="季語検索" oninput="onSaijikiSearchChanged()">
                    <span id="clearSaijikiSearchBtn" class="search-clear-btn hidden" onclick="clearSaijikiSearch(event)">✕</span>
                </div>
            </div>

            <!-- 季節タブ -->
            <div class="saijiki-season-tabs">
                <span id="stabHaru" class="text-tab active" onclick="switchSaijikiSeason('haru')">春</span>
                <span class="text-tab-divider">｜</span>
                <span id="stabNatsu" class="text-tab" onclick="switchSaijikiSeason('natsu')">夏</span>
                <span class="text-tab-divider">｜</span>
                <span id="stabAki" class="text-tab" onclick="switchSaijikiSeason('aki')">秋</span>
                <span class="text-tab-divider">｜</span>
                <span id="stabHuyu" class="text-tab" onclick="switchSaijikiSeason('huyu')">冬</span>
                <span class="text-tab-divider">｜</span>
                <span id="stabShinnen" class="text-tab" onclick="switchSaijikiSeason('shinnen')">新年</span>
                <span class="text-tab-divider">｜</span>
                <span id="stabMuki" class="text-tab" onclick="switchSaijikiSeason('muki')">無季</span>
            </div>

            <!-- 並び順切り替えスイッチ（五十音順・時候順） -->
            <div class="saijiki-mode-switch">
                <span id="smodeGojuon" class="mode-tab active" onclick="switchSaijikiMode('gojuon')">五十音順</span>
                <span class="mode-tab-divider">・</span>
                <span id="smodeJikou" class="mode-tab" onclick="switchSaijikiMode('jikou')">時候順</span>
            </div>
        </div>

        <!-- 🌸 和モダン 透かしフロート見出し（ウォーターマーク） -->
        <div id="saijikiWatermark" class="saijiki-watermark hidden">
            <span id="wmTiming" class="wm-timing">三春</span>
            <span id="wmCat" class="wm-cat">時候</span>
        </div>

        <!-- 季語横スクロールコンテナ（右から左へ並ぶ縦書き季語） -->
        <div id="saijikiKigoList" class="horizontal-scroll-container saijiki-kigo-scroll-list">
        </div>
    </div>

    <!-- 季寄せ・作品一覧スクロール方式 作品鑑賞画面 -->
    <div id="saijikiListRoomPage" class="layer-page">
        <div id="saijikiHaikuList" class="horizontal-scroll-container saijiki-scroll-list"></div>
    </div>

    <!-- 臺俳句：発行年選択 ページ -->
    <div id="issueYearPage" class="layer-page">
        <div id="issueYearList" class="horizontal-scroll-container"></div>
    </div>

    <!-- 臺俳句：発行月選択 ページ -->
    <div id="issueMonthPage" class="layer-page">
        <div id="issueMonthList" class="horizontal-scroll-container"></div>
    </div>

    <!-- 臺俳句：号内選択 ページ -->
    <div id="issueDetailPage" class="layer-page">
        <div id="issueDetailContent" class="fits-screen-container"></div>
    </div>

    <!-- 臺俳句：号内 俳人一覧 ページ -->
    <div id="utenaAuthorListPage" class="layer-page">
        <div id="utenaAuthorList" class="horizontal-scroll-container"></div>
    </div>

    <!-- 一句一画面 スクリーン部屋（おみ句じ・おみ句じ全句用） -->
    <div id="roomPage" class="layer-page">
        <button id="prevBtn" class="nav-arrow arrow-right" onclick="changeHaiku(-1)">＞</button> 
        <button id="nextBtn" class="nav-arrow arrow-left" onclick="changeHaiku(1)">＜</button>  
        <div class="haiku-screen"><p id="haikuPhrase" class="phrase"></p></div>
    </div>

    <!-- 📦 堅牢なデータバンドル（オフライン・ローカル完全対応） -->
    <script src="data_bundle.js?v=3"></script>

    <!-- ⚙️ プログラムファイルを読み込み -->
    <script src="app.js?v=3"></script>

    <!-- 📲 Service Worker（PWA・オフライン対応）登録 -->
    <script>
        if ('serviceWorker' in navigator && (location.protocol === 'http:' || location.protocol === 'https:')) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => {
                    console.log('ServiceWorker 登録スキップ/エラー:', err);
                });
            });
        }
    </script>
</body>
</html>
