<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>うてな俳句会 臺俳句</title>

    <!-- ★ PWA Manifest ファイルの読み込み -->
    <link rel="manifest" href="manifest.json">

    <!-- PWA / Android・iOS スタンドアロン指定 -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="うてな俳句">
    <meta name="application-name" content="うてな俳句">
    <meta name="theme-color" content="#faf9f6">
    
    <!-- アプリアイコン指定 -->
    <link rel="icon" type="image/png" sizes="192x192" href="icon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="icon.png">

    <!-- 🎨 デザインファイルを読み込み -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="loadingOverlay">うてな俳句を開いています...</div>

    <!-- 🐾 おみ句じ猫ボタン -->
    <img id="fixedCatBtn" src="omikuji-cat.png" alt="おみ句じを引く" class="fixed-cat-trigger hidden" onclick="launchOmikuji()" title="おみ句じを引く">

    <!-- 2段構造のグローバルヘッダー領域 -->
    <div id="headerArea" class="global-header-area">
        <div class="header-row-top">
            <div id="globalBreadcrumb" class="breadcrumb" style="display: none;"></div>
        </div>
        <div class="header-row-bottom">
            <div id="roomMainTag" class="info-upper-tag"></div>
            <div id="infoTrigger" onclick="revealHiddenInfo()">ℹ</div>
        </div>
    </div>

    <!-- 🌸 季語解説ポップアップカード -->
    <div id="kigoCardOverlay" class="card-overlay hidden" onclick="closeKigoCard()">
        <div class="kigo-card-content">
            <div class="card-column parent-kigo-col" id="cardParentKigo"></div>
            <div class="card-column child-kigo-col" id="cardChildKigo"></div>
            <div class="card-column desc-kigo-col" id="cardDesc"></div>
        </div>
    </div>

    <!-- 🏡 トップメニュー -->
    <div id="topPage" class="layer-page">
        <!-- おみ句じ ブロック -->
        <div class="menu-block">
            <div class="sub-menu-group">
                <div class="vertical-link sub-link" onclick="openRoom('detarame', 'all', 'いっしょくた')">いっしょくた</div>
                <div class="vertical-link sub-link" onclick="renderPage('haijinPage')">俳人</div>
                <div class="vertical-link sub-link" onclick="renderPage('haikuPage')">季節</div>
            </div>
            <div class="vertical-link main-headline" style="cursor: default;">おみ句じ</div>
        </div>
        
        <!-- 季寄せ ブロック -->
        <div class="menu-block">
            <div class="vertical-link main-headline" onclick="renderPage('saijikiPage')">季寄せ</div>
        </div>

        <!-- うてな俳句 ブロック -->
        <div class="menu-block">
            <div class="vertical-link main-headline" onclick="showIssueYearList()">うてな俳句</div>
        </div>
    </div>

    <!-- おみ句じ：俳人 ページ -->
    <div id="haijinPage" class="layer-page">
        <div id="haijinList" class="horizontal-scroll-container"></div>
    </div>

    <!-- おみ句じ：季節 ページ -->
    <div id="haikuPage" class="layer-page">
        <div class="fits-screen-container">
            <div class="vertical-link" onclick="openRoom('haiku_season', 'haru', '春の句')">春</div>
            <div class="vertical-link" onclick="openRoom('haiku_season', 'natsu', '夏の句')">夏</div>
            <div class="vertical-link" onclick="openRoom('haiku_season', 'aki', '秋の句')">秋</div>
            <div class="vertical-link" onclick="openRoom('haiku_season', 'huyu', '冬の句')">冬</div>
            <div class="vertical-link" onclick="openRoom('haiku_season', 'shinnen', '新年の句')">新年</div>
            <div class="vertical-link" onclick="openRoom('haiku_season', 'muki', '無季の句')">無季</div>
        </div>
    </div>

    <!-- 🌸 季寄せ：大画面 ページ（風月スタイル） -->
    <div id="saijikiPage" class="layer-page saijiki-screen-layer">
        <div class="saijiki-screen-header">
            <!-- ミニマル伸縮検索バー -->
            <div id="saijikiSearchWrapper" class="subtle-search-wrapper" onclick="expandSaijikiSearchInput()">
                <span class="search-icon"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg></span>
                <input type="text" id="saijikiSearchInput" class="subtle-search-input" placeholder="季語検索" oninput="onSaijikiSearchChanged()" onblur="collapseSaijikiSearchIfEmpty()">
                <span id="clearSaijikiSearchBtn" class="search-clear-btn hidden" onclick="clearSaijikiSearch(event)">✕</span>
            </div>

            <!-- 季節タブ -->
            <div class="saijiki-season-tabs">
                <span id="stabHaru" class="text-tab active" onclick="switchSaijikiSeason('haru')">春</span>
                <span class="text-tab-divider">｜</span>
                <span id="stabNatsu" class="text-tab" onclick="switchSaijikiSeason('natsu')">夏</span>
                <span class="text-tab-divider">｜</span>
                <span id="stabAki" class="text-tab" onclick="switchSaijikiSeason('aki')">秋</span>
                <span class="text-tab-divider">｜</span>
                <span id="stabHuyu" class="text-tab" onclick="switchSaijikiSeason('huyu')">冬</span>
                <span class="text-tab-divider">｜</span>
                <span id="stabShinnen" class="text-tab" onclick="switchSaijikiSeason('shinnen')">新年</span>
                <span class="text-tab-divider">｜</span>
                <span id="stabMuki" class="text-tab" onclick="switchSaijikiSeason('muki')">無季</span>
            </div>

            <!-- 並び順切り替えスイッチ（五十音順・時候順） -->
            <div class="saijiki-mode-switch">
                <span id="smodeGojuon" class="mode-tab active" onclick="switchSaijikiMode('gojuon')">五十音順</span>
                <span class="mode-tab-divider">・</span>
                <span id="smodeJikou" class="mode-tab" onclick="switchSaijikiMode('jikou')">時候順</span>
            </div>
        </div>

        <!-- 🌸 和モダン 透かしフロート見出し（ウォーターマーク） -->
        <div id="saijikiWatermark" class="saijiki-watermark hidden">
            <span id="wmTiming" class="wm-timing">三春</span>
            <span id="wmCat" class="wm-cat">時候</span>
        </div>

        <!-- 季語横スクロールコンテナ（右から左へ並ぶ縦書き季語） -->
        <div id="saijikiKigoList" class="horizontal-scroll-container saijiki-kigo-scroll-list">
        </div>

        <!-- 五十音クイックジャンプバー（下部：わ〜あ） -->
        <div id="saijikiGojuonBar" class="gojuon-jump-bar">
            <span class="jump-tab" onclick="jumpToGojuon('わ')">わ</span>
            <span class="jump-tab-dot">・</span>
            <span class="jump-tab" onclick="jumpToGojuon('ら')">ら</span>
            <span class="jump-tab-dot">・</span>
            <span class="jump-tab" onclick="jumpToGojuon('や')">や</span>
            <span class="jump-tab-dot">・</span>
            <span class="jump-tab" onclick="jumpToGojuon('ま')">ま</span>
            <span class="jump-tab-dot">・</span>
            <span class="jump-tab" onclick="jumpToGojuon('は')">は</span>
            <span class="jump-tab-dot">・</span>
            <span class="jump-tab" onclick="jumpToGojuon('な')">な</span>
            <span class="jump-tab-dot">・</span>
            <span class="jump-tab" onclick="jumpToGojuon('た')">た</span>
            <span class="jump-tab-dot">・</span>
            <span class="jump-tab" onclick="jumpToGojuon('さ')">さ</span>
            <span class="jump-tab-dot">・</span>
            <span class="jump-tab" onclick="jumpToGojuon('か')">か</span>
            <span class="jump-tab-dot">・</span>
            <span class="jump-tab" onclick="jumpToGojuon('あ')">あ</span>
        </div>
    </div>

    <!-- 季寄せ・作品一覧スクロール方式 作品鑑賞画面 -->
    <div id="saijikiListRoomPage" class="layer-page">
        <div id="saijikiHaikuList" class="horizontal-scroll-container saijiki-scroll-list"></div>
    </div>

    <!-- 臺俳句：発行年選択 ページ -->
    <div id="issueYearPage" class="layer-page">
        <div id="issueYearList" class="horizontal-scroll-container"></div>
    </div>

    <!-- 臺俳句：発行月選択 ページ -->
    <div id="issueMonthPage" class="layer-page">
        <div id="issueMonthList" class="horizontal-scroll-container"></div>
    </div>

    <!-- 臺俳句：号内選択 ページ -->
    <div id="issueDetailPage" class="layer-page">
        <div id="issueDetailContent" class="fits-screen-container"></div>
    </div>

    <!-- 臺俳句：号内 俳人一覧 ページ -->
    <div id="utenaAuthorListPage" class="layer-page">
        <div id="utenaAuthorList" class="horizontal-scroll-container"></div>
    </div>

    <!-- 一句一画面 スクリーン部屋（おみ句じ・おみ句じ全句用） -->
    <div id="roomPage" class="layer-page">
        <button id="prevBtn" class="nav-arrow arrow-right" onclick="changeHaiku(-1)">＞</button> 
        <button id="nextBtn" class="nav-arrow arrow-left" onclick="changeHaiku(1)">＜</button>  
        <div class="haiku-screen"><p id="haikuPhrase" class="phrase"></p></div>
    </div>

    <!-- ⚙️ プログラムファイルを読み込み -->
    <script src="app.js"></script>

    <!-- 📲 Service Worker（PWA・オフライン対応）登録 -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => {
                    console.log('ServiceWorker 登録スキップ/エラー:', err);
                });
            });
        }
    </script>
</body>
</html>
